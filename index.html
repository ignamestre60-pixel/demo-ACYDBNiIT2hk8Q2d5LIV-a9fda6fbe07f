<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IGMESU - Automatización de Procesos Empresariales con IA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f8fafc;
            color: #111827;
            line-height: 1.6;
        }

        /* HEADER */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #e5e7eb;
            z-index: 1000;
            padding: 1rem 2rem;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #111827;
            letter-spacing: -0.5px;
        }

        nav {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: #374151;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: #0066ff;
        }

        .btn-primary {
            background-color: #0066ff;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            display: inline-block;
        }

        .btn-primary:hover {
            background-color: #0052cc;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: transparent;
            color: #0066ff;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            border: 2px solid #0066ff;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .btn-secondary:hover {
            background-color: #0066ff;
            color: white;
        }

        /* MAIN CONTENT */
        main {
            margin-top: 70px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* HERO SECTION */
        .hero {
            padding: 6rem 2rem;
            text-align: center;
            background-color: #f8fafc;
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 1.5rem;
            color: #111827;
            letter-spacing: -1px;
        }

        .hero .subtitle {
            font-size: 1.25rem;
            color: #4b5563;
            margin-bottom: 2rem;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.8;
        }

        .hero-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 3rem;
            flex-wrap: wrap;
        }

        .hero-tagline {
            font-size: 1rem;
            color: #6b7280;
            font-weight: 500;
            margin-top: 2rem;
        }

        .hero-visual {
            margin-top: 4rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .flow-item {
            background-color: white;
            padding: 1.5rem;
            border-radius: 0.75rem;
            border: 1px solid #e5e7eb;
            min-width: 150px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 600;
            color: #374151;
        }

        .flow-arrow {
            color: #0066ff;
            font-size: 1.5rem;
            font-weight: 700;
        }

        /* DEMO BADGE */
        .demo-badge {
            display: inline-block;
            background-color: #fef3c7;
            color: #92400e;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            border: 1px solid #fcd34d;
        }

        /* PROBLEM SECTION */
        .problem {
            padding: 5rem 2rem;
            background-color: white;
            border-top: 1px solid #e5e7eb;
        }

        .problem h2 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 3rem;
            text-align: center;
            color: #111827;
            line-height: 1.3;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .problem-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .problem-item {
            background-color: #f8fafc;
            padding: 1.5rem;
            border-radius: 0.75rem;
            border-left: 3px solid #0066ff;
            font-size: 0.95rem;
            color: #374151;
        }

        .problem-highlight {
            text-align: center;
            padding: 2rem;
            background-color: #f0f4ff;
            border-radius: 0.75rem;
            margin-top: 2rem;
            border: 1px solid #d0deff;
        }

        .problem-highlight p {
            font-size: 1.25rem;
            font-weight: 700;
            color: #0066ff;
        }

        /* SERVICES SECTION */
        .services {
            padding: 5rem 2rem;
            background-color: #f8fafc;
        }

        .services h2 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 3rem;
            text-align: center;
            color: #111827;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .service-card {
            background-color: white;
            padding: 2rem;
            border-radius: 0.75rem;
            border: 1px solid #e5e7eb;
            transition: all 0.3s ease;
        }

        .service-card:hover {
            border-color: #0066ff;
            box-shadow: 0 4px 12px rgba(0, 102, 255, 0.1);
            transform: translateY(-2px);
        }

        .service-icon {
            width: 50px;
            height: 50px;
            background-color: #f0f4ff;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .service-card h3 {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: #111827;
        }

        .service-card p {
            color: #6b7280;
            line-height: 1.8;
        }

        /* FEATURES SECTION */
        .features {
            padding: 5rem 2rem;
            background-color: white;
        }

        .features h2 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 3rem;
            text-align: center;
            color: #111827;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
        }

        .feature-box {
            padding: 2rem;
            background-color: #f8fafc;
            border-radius: 0.75rem;
            border: 1px solid #e5e7eb;
            text-align: center;
        }

        .feature-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .feature-box h3 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: #111827;
        }

        .feature-box p {
            color: #6b7280;
            font-size: 0.95rem;
        }

        /* BENEFITS SECTION */
        .benefits {
            padding: 5rem 2rem;
            background-color: #f0f4ff;
            border-top: 1px solid #d0deff;
            border-bottom: 1px solid #d0deff;
        }

        .benefits h2 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 3rem;
            text-align: center;
            color: #111827;
        }

        .benefits-list {
            max-width: 700px;
            margin: 0 auto;
        }

        .benefit-item {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
            align-items: flex-start;
        }

        .benefit-checkmark {
            flex-shrink: 0;
            width: 24px;
            height: 24px;
            background-color: #0066ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .benefit-item p {
            color: #374151;
            font-size: 1.05rem;
            line-height: 1.6;
        }

        /* CONTACT SECTION */
        .contact {
            padding: 5rem 2rem;
            background-color: white;
            text-align: center;
        }

        .contact h2 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: #111827;
        }

        .contact p {
            font-size: 1.1rem;
            color: #6b7280;
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .contact-methods {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }

        .contact-method {
            background-color: #f8fafc;
            padding: 2rem;
            border-radius: 0.75rem;
            border: 1px solid #e5e7eb;
        }

        .contact-method h3 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: #111827;
        }

        .contact-method p {
            color: #6b7280;
            margin-bottom: 1rem;
        }

        .contact-method a {
            color: #0066ff;
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
            margin-top: 0.5rem;
        }

        .contact-method a:hover {
            text-decoration: underline;
        }

        /* FOOTER */
        footer {
            background-color: #111827;
            color: white;
            padding: 3rem 2rem;
            border-top: 1px solid #1f2937;
        }

        .footer-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .footer-content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .footer-section h4 {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: white;
        }

        .footer-section a {
            display: block;
            color: #d1d5db;
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
            transition: color 0.3s ease;
        }

        .footer-section a:hover {
            color: #0066ff;
        }

        .footer-bottom {
            border-top: 1px solid #1f2937;
            padding-top: 2rem;
            text-align: center;
            color: #9ca3af;
            font-size: 0.9rem;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            header {
                padding: 1rem;
            }

            .header-container {
                flex-direction: column;
                gap: 1rem;
            }

            nav {
                flex-wrap: wrap;
                gap: 1rem;
                justify-content: center;
            }

            nav a {
                font-size: 0.85rem;
            }

            .hero h1 {
                font-size: 2rem;
            }

            .hero .subtitle {
                font-size: 1rem;
